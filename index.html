<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NOPONTENG 2026</title>
  <style>
    :root{
      --bg0:#05070a;
      --bg1:#090d14;
      --card:#0e1522cc;
      --card2:#0b1220cc;
      --line:#203048;
      --text:#eaf1ff;
      --muted:#9fb0c9;
      --pill:#111c2dcc;
      --pill2:#0e1727cc;

      --good:#bfffe1;
      --good2:#4af0b8;
      --warn:#ffe7a6;
      --warn2:#ffd157;
      --bad:#ffd0d0;
      --bad2:#ff6b6b;

      --cyan:#8ee6ff;
      --shadow: 0 14px 60px rgba(0,0,0,.55);
      --radius: 18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(900px 600px at 20% 10%, #13344a55, transparent 65%),
        radial-gradient(800px 600px at 80% 30%, #2c1d5c55, transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height:100vh;
    }

    .wrap{max-width:1200px;margin:auto;padding:18px 14px 60px}
    header{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:6px 0 14px}
    .title h1{margin:0;font-size:22px;letter-spacing:.3px}
    .title .sub{margin-top:2px;color:var(--muted);font-size:12px}

    .badgeRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .badge{
      padding:8px 12px;border:1px solid var(--line);
      background:linear-gradient(180deg,var(--card),var(--card2));
      border-radius:999px; color:var(--muted); font-size:12px;
    }
    .badge b{color:var(--text);font-weight:700}

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:14px;
    }
    @media (max-width: 980px){
      .grid{grid-template-columns:1fr}
      .badgeRow{justify-content:flex-start}
    }

    .card{
      border:1px solid var(--line);
      background:linear-gradient(180deg,var(--card),var(--card2));
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px;
    }

    .row{display:grid;grid-template-columns: 1.2fr 1fr 1fr 1fr; gap:10px}
    @media (max-width: 980px){ .row{grid-template-columns:1fr 1fr} }
    @media (max-width: 520px){ .row{grid-template-columns:1fr} }

    label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
    input, select, textarea{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#0a1220;
      color:var(--text);
      outline:none;
    }
    input:focus, select:focus, textarea:focus{
      border-color:#3ea7ff;
      box-shadow:0 0 0 4px rgba(62,167,255,.18);
    }

    .btnRow{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
      margin-top:10px;
    }
    @media (max-width: 520px){ .btnRow{grid-template-columns:1fr} }

    /* ===== Pill Buttons (lebih obvious) ===== */
    .pillBtn{
      cursor:pointer;
      width:100%;
      border-radius:999px;
      border:1px solid var(--line);
      padding:12px 14px;
      background:linear-gradient(180deg, #0e1a2dcc, #0b1424cc);
      color:var(--text);
      font-weight:800;
      letter-spacing:.2px;
      box-shadow: 0 10px 26px rgba(0,0,0,.28);
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease, border-color .12s ease;
      user-select:none;
    }
    .pillBtn:hover{
      transform: translateY(-1px);
      border-color:#5bb7ff;
      box-shadow: 0 12px 30px rgba(0,0,0,.32), 0 0 0 4px rgba(91,183,255,.16);
      filter: brightness(1.10);
    }
    .pillBtn:active{
      transform: translateY(0px) scale(.99);
      filter: brightness(1.02);
    }
    .pillBtn:disabled{
      opacity:.45; cursor:not-allowed; filter:saturate(.6);
      transform:none; box-shadow:none;
    }

    .pillGood{background:linear-gradient(180deg,#d9ffef,#bfffe1); color:#063a2a; border-color:#bfffe1;}
    .pillBad{background:linear-gradient(180deg,#ffe1e1,#ffd0d0); color:#4a0b0b; border-color:#ffd0d0;}
    .pillSoft{background:linear-gradient(180deg,#f0ecff,#e7e1ff); color:#2b1a55; border-color:#e7e1ff;}

    .hint{margin-top:8px;color:var(--muted);font-size:12px}

    .tableCard{margin-top:14px}
    .stats{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      margin-bottom:10px;
    }
    .chip{
      padding:8px 12px;border-radius:999px;border:1px solid var(--line);
      background:#0a1220;color:var(--muted);font-size:12px;
    }
    .chip b{color:var(--text)}

    .list{
      display:flex; flex-direction:column; gap:10px;
      max-height: 62vh;
      overflow:auto;
      padding-right:6px;
    }
    .item{
      border:1px solid #1b2a40;
      background:linear-gradient(180deg,#0b1322cc,#08101ecc);
      border-radius:16px;
      padding:12px;
      display:grid;
      grid-template-columns: 110px 1.1fr 1.4fr 1.4fr 1.2fr;
      gap:10px;
      align-items:center;
    }
    @media (max-width: 980px){
      .item{grid-template-columns:110px 1fr; gap:10px}
      .colSpan{grid-column:1/-1}
    }

    .idBox{
      font-weight:900;
      color:#d5e7ff;
      font-size:14px;
    }
    .nameBox{font-weight:800; line-height:1.2}
    .nameBox small{display:block;color:var(--muted);font-weight:600;margin-top:3px}

    .pillGroup{display:flex;flex-wrap:wrap;gap:8px}
    .pillChoice{
      cursor:pointer;
      border-radius:999px;
      padding:8px 12px;
      border:1px solid #2a3b55;
      background:linear-gradient(180deg,var(--pill),var(--pill2));
      color:var(--text);
      font-weight:800;
      font-size:12px;
      letter-spacing:.2px;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease, border-color .12s ease;
      user-select:none;
      position:relative;
      outline:none;
    }
    .pillChoice:hover{
      transform: translateY(-1px);
      border-color:#63c5ff;
      box-shadow: 0 0 0 4px rgba(99,197,255,.14);
      filter: brightness(1.12);
    }
    .pillChoice.selected{
      border-color:#ffffffcc;
      filter: brightness(1.22) saturate(1.10);
      box-shadow: 0 0 0 5px rgba(255,255,255,.12), 0 12px 30px rgba(0,0,0,.28);
    }
    .pillChoice.selected::after{
      content:"✓";
      position:absolute;
      right:8px; top:50%;
      transform:translateY(-50%);
      font-weight:1000;
      opacity:.95;
    }

    .cHadir.selected{ background:linear-gradient(180deg,#d9ffef,#bfffe1); color:#063a2a; border-color:#bfffe1; }
    .cTidak.selected{ background:linear-gradient(180deg,#ffe1e1,#ffd0d0); color:#4a0b0b; border-color:#ffd0d0; }
    .cLewat.selected{ background:linear-gradient(180deg,#fff1c8,#ffe7a6); color:#4a3a06; border-color:#ffe7a6; }

    .cHantar.selected{ background:linear-gradient(180deg,#d9ffef,#bfffe1); color:#063a2a; border-color:#bfffe1; }
    .cTakHantar.selected{ background:linear-gradient(180deg,#ffe1e1,#ffd0d0); color:#4a0b0b; border-color:#ffd0d0; }
    .cTakBawa.selected{ background:linear-gradient(180deg,#fff1c8,#ffe7a6); color:#4a3a06; border-color:#ffe7a6; }

    textarea{
      min-height:44px;
      resize:vertical;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      background:rgba(8,14,24,.92);
      border:1px solid #24344d;
      color:#eaf1ff;
      padding:10px 12px;
      border-radius:14px;
      box-shadow:0 20px 70px rgba(0,0,0,.55);
      font-size:13px;
      display:none;
      max-width: 92vw;
      z-index:9999;
    }
    .toast.show{display:block}

    .dangerText{color:#ffb4b4;font-weight:800}
    .okText{color:#bfffe1;font-weight:900}
    .muted{color:var(--muted)}
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="title">
        <h1>NOPONTENG 2026</h1>
        <div class="sub">Kehadiran + Latihan buku • <i>GitHub Pages</i> • <i>Google Apps Script</i> • <i>Google Sheets</i></div>
      </div>
      <div class="badgeRow">
        <div class="badge">API: <b id="apiStatus">…</b></div>
        <div class="badge">Token POST: <b id="tokenStatus">not set</b></div>
      </div>
    </header>

    <div class="grid">
      <div class="card">
        <div class="row">
          <div>
            <label>Tarikh</label>
            <input id="tarikh" type="date" />
          </div>
          <div>
            <label>Slot (T1–T14)</label>
            <select id="slot"></select>
          </div>
          <div>
            <label>Kelas</label>
            <select id="kelas"></select>
          </div>
          <div>
            <label>Dicatat oleh</label>
            <input id="dicatatOleh" type="text" value="Maria" />
          </div>
        </div>

        <div class="btnRow">
          <button class="pillBtn" id="btnLoad">Load murid</button>
          <button class="pillBtn pillSoft" id="btnReset">Reset pilihan</button>
        </div>
        <div class="hint" id="hintLoad">—</div>
      </div>

      <div class="card">
        <div class="btnRow">
          <button class="pillBtn pillGood" id="btnSaveAll">Simpan semua</button>
          <button class="pillBtn pillBad" id="btnForceEmpty">Simpan kosong (force)</button>
        </div>
        <div class="hint" id="hintSave">—</div>
      </div>
    </div>

    <div class="card tableCard">
      <div class="stats">
        <div class="chip">Jumlah murid: <b id="statTotal">0</b></div>
        <div class="chip">Kehadiran dipilih: <b id="statKehadiran">0</b></div>
        <div class="chip">Latihan dipilih: <b id="statLatihan">0</b></div>
        <div class="chip muted">Tip: klik pill status sampai nampak ✓ (selected)</div>
      </div>

      <div class="list" id="list"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // =================== CONFIG ===================
  const API_BASE = "https://script.google.com/macros/s/AKfycbzvH3oDpQszQ0d4ca7uuu1jMIo9jaEidQie70Z8vgTJIXOxncVucd4rjiD8g-PkVZzH/exec";
  const READ_TOKEN = "MARIA2026"; // untuk GET (kelas/slot/murid)
  // Token POST boleh sama. Kita simpan dalam localStorage supaya senang.

  // =================== STATE ===================
  let muridList = [];            // {idMurid, nama}
  let pilihan = {};              // idMurid -> {kehadiran, latihan, catatan}
  const $ = (id)=>document.getElementById(id);

  // =================== UI HELPERS ===================
  function toast(msg, type="info"){
    const el = $("toast");
    el.innerHTML = msg;
    el.classList.add("show");
    if(type==="bad") el.style.borderColor = "#ff6b6b";
    else if(type==="ok") el.style.borderColor = "#4af0b8";
    else el.style.borderColor = "#24344d";
    setTimeout(()=> el.classList.remove("show"), 2600);
  }

  function setApiStatus(ok){
    $("apiStatus").textContent = ok ? "ok" : "down";
    $("apiStatus").className = ok ? "okText" : "dangerText";
  }

  function setTokenStatus(){
    const t = localStorage.getItem("POST_TOKEN") || "";
    $("tokenStatus").textContent = t ? "set" : "not set";
    $("tokenStatus").className = t ? "okText" : "dangerText";
  }

  function updateStats(){
    $("statTotal").textContent = muridList.length;
    let k=0,l=0;
    muridList.forEach(m=>{
      const p = pilihan[m.idMurid] || {};
      if(p.kehadiran) k++;
      if(p.latihan) l++;
    });
    $("statKehadiran").textContent = k;
    $("statLatihan").textContent = l;
  }

  function fmtHari(dateStr){
    // dateStr: yyyy-mm-dd
    const d = new Date(dateStr+"T00:00:00");
    const hari = ["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"];
    return hari[d.getDay()];
  }

  // =================== API HELPERS ===================
  async function apiGet(action, params={}){
    const url = new URL(API_BASE);
    url.searchParams.set("action", action);
    url.searchParams.set("token", READ_TOKEN);
    Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
    const res = await fetch(url.toString(), { method:"GET" });
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || "GET failed");
    return json.data;
  }

  async function apiPost(action, payload){
    const postToken = localStorage.getItem("POST_TOKEN") || READ_TOKEN;
    const body = { token: postToken, action, payload };
    const res = await fetch(API_BASE, {
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    });
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || "POST failed");
    return json.result;
  }

  // =================== RENDER LIST ===================
  function renderList(){
    const list = $("list");
    list.innerHTML = "";

    muridList.forEach(m=>{
      const p = pilihan[m.idMurid] || (pilihan[m.idMurid] = { kehadiran:"", latihan:"", catatan:"" });

      const item = document.createElement("div");
      item.className = "item";

      // ID
      const idBox = document.createElement("div");
      idBox.className = "idBox";
      idBox.textContent = m.idMurid;

      // Nama
      const nameBox = document.createElement("div");
      nameBox.className = "nameBox";
      nameBox.innerHTML = `${escapeHtml(m.nama)}<small>${escapeHtml(($("kelas").selectedOptions[0]?.textContent)||"")}</small>`;

      // Kehadiran choices
      const keh = document.createElement("div");
      keh.className = "colSpan";
      keh.innerHTML = `<div class="muted" style="font-size:12px;margin-bottom:6px;font-weight:700">Kehadiran</div>`;
      const g1 = document.createElement("div");
      g1.className = "pillGroup";
      g1.appendChild(makeChoice("HADIR", "kehadiran", "cHadir", m.idMurid));
      g1.appendChild(makeChoice("TIDAK HADIR", "kehadiran", "cTidak", m.idMurid));
      g1.appendChild(makeChoice("LEWAT", "kehadiran", "cLewat", m.idMurid));
      keh.appendChild(g1);

      // Latihan choices
      const lat = document.createElement("div");
      lat.className = "colSpan";
      lat.innerHTML = `<div class="muted" style="font-size:12px;margin-bottom:6px;font-weight:700">Latihan buku</div>`;
      const g2 = document.createElement("div");
      g2.className = "pillGroup";
      g2.appendChild(makeChoice("HANTAR", "latihan", "cHantar", m.idMurid));
      g2.appendChild(makeChoice("TIDAK HANTAR", "latihan", "cTakHantar", m.idMurid));
      g2.appendChild(makeChoice("TIDAK BAWA BUKU", "latihan", "cTakBawa", m.idMurid));
      lat.appendChild(g2);

      // Catatan
      const cat = document.createElement("div");
      cat.className = "colSpan";
      const ta = document.createElement("textarea");
      ta.placeholder = "Catatan (optional)";
      ta.value = p.catatan || "";
      ta.addEventListener("input", ()=>{ p.catatan = ta.value; });
      cat.appendChild(ta);

      // Layout desktop
      item.appendChild(idBox);
      item.appendChild(nameBox);

      const wrapKeh = document.createElement("div");
      wrapKeh.appendChild(keh);

      const wrapLat = document.createElement("div");
      wrapLat.appendChild(lat);

      // for wide screens, we keep 5 cols by inserting as grid items
      // but on mobile, we mark with colSpan.
      item.appendChild(wrapKeh);
      item.appendChild(wrapLat);
      item.appendChild(cat);

      list.appendChild(item);
      // refresh selected states
      refreshSelectedFor(m.idMurid);
    });

    updateStats();
  }

  function makeChoice(label, field, cls, idMurid){
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = `pillChoice ${cls}`;
    btn.textContent = label;
    btn.addEventListener("click", ()=>{
      pilihan[idMurid][field] = label;
      refreshSelectedFor(idMurid);
      updateStats();
    });
    return btn;
  }

  function refreshSelectedFor(idMurid){
    const p = pilihan[idMurid] || {};
    const list = $("list");
    // brute but ok for 100-200 rows
    list.querySelectorAll(".item").forEach(item=>{
      const id = item.querySelector(".idBox")?.textContent;
      if(id !== idMurid) return;

      // Kehadiran
      item.querySelectorAll(".pillChoice").forEach(b=>{
        const t = b.textContent.trim();
        const isKeh = ["HADIR","TIDAK HADIR","LEWAT"].includes(t);
        const isLat = ["HANTAR","TIDAK HANTAR","TIDAK BAWA BUKU"].includes(t);

        if(isKeh){
          b.classList.toggle("selected", t === (p.kehadiran||""));
        }
        if(isLat){
          b.classList.toggle("selected", t === (p.latihan||""));
        }
      });
    });
  }

  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, m=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  // =================== FLOW ===================
  async function init(){
    // default tarikh hari ni
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth()+1).padStart(2,"0");
    const dd = String(today.getDate()).padStart(2,"0");
    $("tarikh").value = `${yyyy}-${mm}-${dd}`;

    setTokenStatus();

    // ping api (tanpa token)
    try{
      const pingUrl = new URL(API_BASE);
      pingUrl.searchParams.set("action","ping");
      const r = await fetch(pingUrl.toString());
      const j = await r.json();
      setApiStatus(!!j.ok);
    } catch(e){
      setApiStatus(false);
    }

    // load kelas/slot
    try{
      const [kelas, slot] = await Promise.all([
        apiGet("kelas"),
        apiGet("slot"),
      ]);

      $("kelas").innerHTML = kelas.map(k=>`<option value="${escapeHtml(k.kelasId)}">${escapeHtml(k.namaPaparan)}</option>`).join("");
      $("slot").innerHTML  = slot.map(s=>`<option value="${escapeHtml(s.slotId)}">${escapeHtml(s.label)}</option>`).join("");

      $("hintLoad").innerHTML = `<span class="okText">Ready.</span> Pilih tarikh + slot + kelas → tekan <b>Load murid</b>.`;
    } catch(e){
      $("hintLoad").innerHTML = `<span class="dangerText">Gagal load kelas/slot:</span> ${escapeHtml(e.message)}`;
      toast("Gagal load kelas/slot. Semak token & API.", "bad");
    }
  }

  async function loadMurid(){
    const kelasId = $("kelas").value;
    if(!kelasId){
      toast("Pilih kelas dulu.", "bad");
      return;
    }

    $("btnLoad").disabled = true;
    $("hintLoad").textContent = "Loading murid…";
    try{
      muridList = await apiGet("murid", { kelasId });
      pilihan = {};
      muridList.forEach(m=> pilihan[m.idMurid] = { kehadiran:"HADIR", latihan:"HANTAR", catatan:"" }); // auto default
      renderList();
      $("hintLoad").innerHTML = `Murid loaded (<b>${muridList.length}</b>). Default: <b>HADIR</b> + <b>HANTAR</b>.`;
      toast(`Murid loaded: ${muridList.length}`, "ok");
    } catch(e){
      $("hintLoad").innerHTML = `<span class="dangerText">Gagal load murid:</span> ${escapeHtml(e.message)}`;
      toast("Gagal load murid. Semak data MURID (kelasId/aktif).", "bad");
    } finally{
      $("btnLoad").disabled = false;
    }
  }

  function resetPilihan(){
    if(!muridList.length){
      toast("Belum ada murid. Load dulu.", "bad");
      return;
    }
    muridList.forEach(m=>{
      pilihan[m.idMurid] = { kehadiran:"HADIR", latihan:"HANTAR", catatan:"" };
    });
    renderList();
    toast("Reset ke default (HADIR + HANTAR).", "ok");
  }

  function validateBeforeSave(){
    if(!muridList.length) return "Belum load murid.";
    if(!$("tarikh").value) return "Tarikh kosong.";
    if(!$("slot").value) return "Slot belum pilih.";
    if(!$("kelas").value) return "Kelas belum pilih.";
    const who = ($("dicatatOleh").value||"").trim();
    if(!who) return "Ruangan 'Dicatat oleh' kosong.";
    return "";
  }

  async function saveAll(forceEmpty=false){
    const err = validateBeforeSave();
    if(err){ toast(err, "bad"); return; }

    const tarikh = $("tarikh").value;         // yyyy-mm-dd
    const hari = fmtHari(tarikh);
    const slotId = $("slot").value;
    const kelasId = $("kelas").value;
    const dicatatOleh = ($("dicatatOleh").value||"").trim();

    // prepare payload arrays (BATCH)
    const kehList = [];
    const latList = [];

    muridList.forEach(m=>{
      const p = pilihan[m.idMurid] || {};
      const statusK = forceEmpty ? "" : (p.kehadiran||"");
      const statusL = forceEmpty ? "" : (p.latihan||"");
      const cat = (p.catatan||"").trim();

      kehList.push({
        tarikh, hari, slotId, kelasId,
        idMurid: m.idMurid,
        nama: m.nama,
        status: statusK,
        catatan: cat,
        dicatatOleh
        // timestamp ditambah oleh backend
      });

      latList.push({
        tarikh, slotId, kelasId,
        idMurid: m.idMurid,
        status: statusL,
        catatan: cat,
        dicatatOleh
        // timestamp ditambah oleh backend
      });
    });

    // UI lock
    $("btnSaveAll").disabled = true;
    $("btnForceEmpty").disabled = true;
    $("hintSave").innerHTML = "Saving (batch)… <span class='muted'>(jangan tutup tab)</span>";

    try{
      // 2 post sahaja (bukan per murid)
      await apiPost("saveKehadiranBatch", kehList);
      await apiPost("saveLatihanBatch", latList);

      $("hintSave").innerHTML = `<span class="okText">Saved.</span> ${muridList.length} murid (batch).`;
      toast("Saved (batch) ✅", "ok");
    } catch(e){
      $("hintSave").innerHTML = `<span class="dangerText">Gagal save:</span> ${escapeHtml(e.message)}`;
      toast("Save gagal. Semak token POST / deploy permission.", "bad");
    } finally{
      $("btnSaveAll").disabled = false;
      $("btnForceEmpty").disabled = false;
    }
  }

  // =================== EVENTS ===================
  $("btnLoad").addEventListener("click", loadMurid);
  $("btnReset").addEventListener("click", resetPilihan);
  $("btnSaveAll").addEventListener("click", ()=> saveAll(false));
  $("btnForceEmpty").addEventListener("click", ()=> saveAll(true));

  // set post token once (optional)
  // kau boleh tukar ikut keselesaan
  localStorage.setItem("POST_TOKEN", "MARIA2026");
  setTokenStatus();

  init();
</script>
</body>
